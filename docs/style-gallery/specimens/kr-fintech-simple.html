<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모아페이 — 핀테크 심플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --page:#F2F4F6; --card:#FFFFFF; --t1:#191F28; --t2:#4E5968; --t3:#6B7684; --div:#E5E8EB;
  --blue:#2F6FED; --blue-press:#2459C9; --blue-tint:#E8F0FE;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html:lang(ko){word-break:keep-all;overflow-wrap:break-word}
body{font-family:var(--sans);background:#E9ECEF;color:var(--t1);font-size:16px;line-height:1.6;letter-spacing:-.015em;-webkit-font-smoothing:antialiased}
h1,h2{text-wrap:balance}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}

.head{max-width:1160px;margin:0 auto;padding:28px 24px 0;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px}
.head h1{font-size:16px;font-weight:500;color:var(--t2);letter-spacing:-.01em}
.head h1::before{content:"";display:inline-block;width:1px;height:14px;background:#C9CED4;margin:0 14px 0 4px;vertical-align:-1px}

.stage{display:flex;justify-content:center;gap:56px;padding:28px 24px 56px}
figure{display:flex;flex-direction:column;align-items:center;gap:14px}
figcaption{font-size:14px;color:var(--t2);font-weight:500}
.phone{width:330px;height:700px;border-radius:50px;background:#191F28;padding:10px}
.screen{position:relative;height:100%;border-radius:40px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.screen.grey{background:var(--page)}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 4px;font-size:13px;font-weight:600}
.status i{display:block;width:22px;height:11px;border-radius:3px;border:1.5px solid var(--t1)}
.top{height:48px;display:flex;align-items:center;padding:0 16px}
.body{padding:8px 22px 0;flex:1}
.label{font-size:15px;color:var(--t2);font-weight:500;margin-bottom:4px}
.title{font-size:24px;line-height:1.38;font-weight:700;letter-spacing:-.025em}
.amount{font-size:40px;line-height:1.2;font-weight:700;letter-spacing:-.03em;margin-top:22px}
.amount small{font-size:22px;font-weight:600;margin-left:2px}
.hint{font-size:14px;color:var(--t3);margin-top:6px}
.hint b{color:var(--blue);font-weight:600}
.chips{display:flex;gap:8px;margin-top:22px}
.chips span{height:34px;padding:0 12px;border-radius:10px;background:var(--page);font-size:14px;font-weight:600;color:var(--t2);display:grid;place-items:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 6px 0;row-gap:2px}
.keys span{height:54px;display:grid;place-items:center;font-size:24px;font-weight:600}
.bottom{padding:10px 20px calc(18px + env(safe-area-inset-bottom))}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;transition:background-color .2s ease-out,transform .2s ease-out}
.btn:active{background:var(--blue-press);transform:scale(.98)}
.home{width:112px;height:4px;border-radius:2px;background:var(--t1);margin:12px auto 0;opacity:.85}

.group{background:var(--card);border-radius:20px;padding:4px 0;margin-top:14px}
.row{display:flex;align-items:center;gap:14px;height:64px;padding:0 18px}
.ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue-tint)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:15px;font-weight:600;line-height:1.5}
.tx span{display:block;font-size:13px;color:var(--t3);line-height:1.5;letter-spacing:0}
.val{font-size:15px;font-weight:600}
.sum{background:var(--card);border-radius:20px;padding:22px 20px 20px;margin-top:4px}

.done{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:96px 22px 0}
.check{width:64px;height:64px;border-radius:50%;background:var(--blue);display:grid;place-items:center;margin-bottom:24px}
.detail{width:100%;margin-top:40px;border-top:1px solid var(--div);padding-top:16px;text-align:left}
.detail p{display:flex;justify-content:space-between;font-size:15px;color:var(--t2);padding:7px 0}
.detail p b{color:var(--t1);font-weight:600}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header class="head">
  <span class="logo"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="8" fill="#2F6FED"/><path d="M7 17V9l6 5 6-5v8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>모아페이</span>
  <h1>보내고, 쓴 돈을 바로 확인해요</h1>
</header>

<main class="stage">
  <figure>
    <div class="phone"><div class="screen">
      <div class="status"><span class="num">9:41</span><i></i></div>
      <div class="top"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2" stroke-linecap="round" aria-label="뒤로"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="body">
        <p class="label">지수에게</p>
        <h2 class="title">얼마를 보낼까요?</h2>
        <p class="amount num">50,000<small>원</small></p>
        <p class="hint num">모아페이 잔액 1,284,300원</p>
        <div class="chips num"><span>+1만</span><span>+5만</span><span>+10만</span><span>전액</span></div>
        <div class="keys num"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>00</span><span>0</span><span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="지우기"><path d="M9 6h11v12H9l-5-6z"/><path d="M12.5 10l4 4M16.5 10l-4 4"/></svg></span></div>
      </div>
      <div class="bottom"><a class="btn" href="#">보내기</a><div class="home"></div></div>
    </div></div>
    <figcaption>송금 금액 입력</figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen grey">
      <div class="status"><span class="num">9:41</span><i></i></div>
      <div class="body" style="padding-top:20px">
        <div class="sum">
          <p class="label">10월에 쓴 돈</p>
          <p class="amount num" style="margin-top:2px">684,200<small>원</small></p>
          <p class="hint num">지난달보다 <b>52,100원 덜</b> 썼어요</p>
        </div>
        <div class="group">
          <div class="row"><span class="ic"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2F6FED" stroke-width="1.8" stroke-linecap="round"><path d="M5 2v6a2 2 0 0 0 2 2v6M9 2v6a2 2 0 0 1-2 2M13 2c-1.5 1-2 3-2 5s.8 3 2 3v6"/></svg></span><span class="tx"><b>식비</b><span class="num">38건</span></span><span class="val num">248,000원</span></div>
          <div class="row"><span class="ic"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2F6FED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2.5" width="12" height="11" rx="3"/><path d="M3 9h12M6 16l1-2.5M12 16l-1-2.5"/></svg></span><span class="tx"><b>교통</b><span class="num">22건</span></span><span class="val num">96,400원</span></div>
          <div class="row"><span class="ic"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2F6FED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="13" height="10" rx="2"/><path d="M7.5 7.5l3 1.5-3 1.5z"/></svg></span><span class="tx"><b>구독</b><span class="num">4건</span></span><span class="val num">41,800원</span></div>
          <div class="row"><span class="ic"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2F6FED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6h11l-1 9h-9z"/><path d="M6.5 6a2.5 2.5 0 0 1 5 0"/></svg></span><span class="tx"><b>쇼핑</b><span class="num">9건</span></span><span class="val num">187,300원</span></div>
        </div>
      </div>
      <div class="bottom"><a class="btn" href="#">11월 예산 정하기</a><div class="home"></div></div>
    </div></div>
    <figcaption>이번 달 지출</figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen">
      <div class="status"><span class="num">9:41</span><i></i></div>
      <div class="done">
        <span class="check"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 15.5l5 5L22.5 10"/></svg></span>
        <h2 class="title">지수에게<br><span class="num">50,000원</span>을 보냈어요</h2>
        <div class="detail num">
          <p>받는 계좌<b>모아은행 ****4821</b></p>
          <p>보낸 시각<b>10.15 14:02</b></p>
          <p>수수료<b>0원</b></p>
        </div>
      </div>
      <div class="bottom"><a class="btn" href="#">확인</a><div class="home"></div></div>
    </div></div>
    <figcaption>송금 완료</figcaption>
  </figure>
</main>
</body>
</html>
