<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아 레코더 R1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink: #17171A;
    --ink-2: #55555C;
    --line: rgba(23, 23, 26, 0.1);
    --paper: #FFFFFF;
    --surface: #F4F4F3;
    --rec: #D2352B;            /* single accent: the record button only */
    --space-section: clamp(72px, 12vw, 160px);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html:lang(ko) { word-break: keep-all; overflow-wrap: break-word; }
  body { font-family: var(--font); background: var(--paper); color: var(--ink); font-size: 18px; line-height: 1.7; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 40px; }

  .nav { height: 80px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
  .nav-links { display: flex; gap: 40px; font-size: 15px; color: var(--ink-2); align-items: center; }
  .nav-links a:hover { color: var(--ink); }
  .nav-links .buy { color: var(--ink); font-weight: 600; }

  .hero { padding-top: 120px; text-align: center; }
  .hero .name { font-size: 16px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
  .hero h1 { margin-top: 16px; font-size: 64px; line-height: 1.2; font-weight: 600; letter-spacing: -0.03em; }
  .hero .sub { margin: 28px auto 0; max-width: 26em; color: var(--ink-2); font-size: 18px; text-wrap: balance; }
  .actions { margin-top: 40px; display: flex; gap: 32px; justify-content: center; align-items: center; }
  .btn { display: inline-flex; align-items: center; height: 52px; padding: 0 28px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 600; transition: background-color 200ms ease-out; }
  .btn:hover { background: #2E2E33; }
  .btn:focus-visible, .link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .price { font-size: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .link { font-size: 16px; font-weight: 500; border-bottom: 1px solid var(--line); padding-bottom: 2px; }

  .product { margin-top: 64px; display: flex; justify-content: center; }
  .product svg { width: 660px; max-width: 100%; height: auto; }

  .next { padding: var(--space-section) 0; }
  .next h2 { font-size: 40px; line-height: 1.3; font-weight: 600; letter-spacing: -0.02em; max-width: 14em; }
  .next p { margin-top: 32px; max-width: 34em; color: var(--ink-2); }

  @media (max-width: 760px) {
    .wrap { padding: 0 20px; }
    .nav-links a:not(.buy) { display: none; }
    .hero { padding-top: 72px; }
    .hero h1 { font-size: 40px; }
    .actions { flex-direction: column; gap: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header class="wrap nav">
    <a class="logo" href="#">모아 레코더</a>
    <nav class="nav-links" aria-label="주요 메뉴">
      <a href="#">개요</a>
      <a href="#">사양</a>
      <a href="#">고객 지원</a>
      <a class="buy" href="#">구매</a>
    </nav>
  </header>

  <main>
    <section class="wrap hero">
      <p class="name">모아 레코더 R1</p>
      <h1>꺼내서 한 번 누르면,<br>회의가 글로 남아요.</h1>
      <p class="sub">버튼 하나로 녹음하고, 휴대폰을 열면 이미 받아 적혀 있어요. 무게 38g, 한 번 충전으로 20시간.</p>
      <div class="actions">
        <a class="btn" href="#">구매하기</a>
        <span class="price">189,000원</span>
        <a class="link" href="#">사양 보기</a>
      </div>
    </section>

    <section class="wrap product" aria-label="모아 레코더 R1 제품 그림">
      <svg viewBox="0 0 820 260" fill="none" role="img" aria-label="가로로 놓인 얇은 회색 녹음기. 왼쪽에 마이크 구멍, 가운데에 빨간 녹음 버튼이 있다.">
        <ellipse cx="410" cy="236" rx="330" ry="10" fill="#17171A" opacity="0.07"/>
        <rect x="70" y="40" width="680" height="176" rx="40" fill="#2A2A2E"/>
        <rect x="70" y="40" width="680" height="176" rx="40" stroke="#3C3C41" stroke-width="2"/>
        <rect x="78" y="46" width="664" height="10" rx="5" fill="#3A3A3F"/>
        <g fill="#141416">
          <circle cx="132" cy="96" r="4"/><circle cx="148" cy="96" r="4"/><circle cx="164" cy="96" r="4"/><circle cx="180" cy="96" r="4"/>
          <circle cx="132" cy="112" r="4"/><circle cx="148" cy="112" r="4"/><circle cx="164" cy="112" r="4"/><circle cx="180" cy="112" r="4"/>
          <circle cx="132" cy="128" r="4"/><circle cx="148" cy="128" r="4"/><circle cx="164" cy="128" r="4"/><circle cx="180" cy="128" r="4"/>
          <circle cx="132" cy="144" r="4"/><circle cx="148" cy="144" r="4"/><circle cx="164" cy="144" r="4"/><circle cx="180" cy="144" r="4"/>
          <circle cx="132" cy="160" r="4"/><circle cx="148" cy="160" r="4"/><circle cx="164" cy="160" r="4"/><circle cx="180" cy="160" r="4"/>
        </g>
        <circle cx="410" cy="128" r="46" fill="#1E1E21" stroke="#4A4A50" stroke-width="2"/>
        <circle cx="410" cy="128" r="24" fill="#D2352B"/>
        <rect x="560" y="112" width="120" height="32" rx="6" fill="#111113"/>
        <text x="620" y="134" text-anchor="middle" font-family="Pretendard Variable, Pretendard, sans-serif" font-size="16" font-weight="500" fill="#E8E8EA" style="font-variant-numeric: tabular-nums;">00:42:18</text>
        <circle cx="700" cy="128" r="4" fill="#5BD08A"/>
        <rect x="748" y="116" width="6" height="24" rx="2" fill="#141416"/>
      </svg>
    </section>

    <section class="wrap next">
      <h2>켜는 버튼도, 고르는 메뉴도 없어요</h2>
      <p>주머니에서 꺼내 가운데를 누르면 녹음이 시작돼요. 다시 누르면 끝나고, 휴대폰과 가까워지면 알아서 옮겨져요.</p>
    </section>
  </main>
</body>
</html>
